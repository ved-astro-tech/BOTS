# Job or business: each card leans one way. The evidence pack reports both totals plus the
# running dasha lords' links to the 6th (service) and 7th (business), so the reading can weigh timing.
orientation_cards:
  - id: ORI-J01
    title: 6th lord linked with the 10th
    leans: job
    predicate: lords_connected
    params: {house_a: 6, house_b: 10}
    weight: 3
    effect: Career through service, employment and competition.
    source: Phaladeepika and common practice, 6th house as service
    phrasing_en: The lord of service is tied to your 10th house, which favours a job.
  - id: ORI-J02
    title: Strong malefic in the 6th
    leans: job
    predicate: planets_in_house
    params: {house: 6, planets: [Rahu, Saturn, Mars, Sun]}
    weight: 2
    effect: Wins in competition, exams and interviews; thrives in organisations.
    source: Upachaya principle (malefics do well in 3, 6, 10, 11)
    phrasing_en: A strong planet in your 6th helps you beat competition, which suits employment.
  - id: ORI-J03
    title: 10th lord in the 6th
    leans: job
    predicate: lord_in_houses
    params: {house: 10, houses: [6]}
    weight: 3
    effect: Work under others; service rather than ownership.
