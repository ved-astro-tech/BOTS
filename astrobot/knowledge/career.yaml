  - id: CAR-017
    title: 10th lord strong in Dashamsha (D10)
    predicate: lord_strength
    params: {house: 10, min: 0.75, varga: D10}
    weight: 6
    effect: Career promise confirmed in the divisional chart of profession.
    source: BPHS, Shodashavarga (D10 for power and position)
    phrasing_en: Your Dashamsha chart confirms a strong career.

  - id: CAR-018
    title: 10th lord debilitated in Dashamsha (D10)
